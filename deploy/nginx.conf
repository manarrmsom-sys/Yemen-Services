# /etc/nginx/sites-available/yemen-services
# Cloudflare -> Nginx (reverse proxy + TLS termination) -> PHP-FPM
# Assumes certbot-managed certs; Cloudflare in "Full (strict)" mode.

upstream php_fpm {
    server unix:/run/php/php8.2-fpm.sock;
}

# --- Restore the real client IP from Cloudflare ---
# (populate /etc/nginx/cloudflare-ips.conf from https://www.cloudflare.com/ips/)
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

# Rate-limit zones (defence in depth; app also throttles).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=otp:10m rate=1r/s;

server {
    listen 80;
    server_name yemenservices.example www.yemenservices.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yemenservices.example;

    ssl_certificate     /etc/letsencrypt/live/yemenservices.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yemenservices.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/yemen-services/current/public;
    index index.php;

    client_max_body_size 12M;          # KYC / top-up proof uploads
    charset utf-8;

    # Security headers are also set by the app; these are a backstop.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Long-cache the hashed Vite build; never cache the service worker.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { try_files $uri =404; }

    location /api/v1/auth/otp/ {
        limit_req zone=otp burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass php_fpm;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|log|md|lock)$ { deny all; }
}
