; /etc/supervisor/conf.d/yemen-services.conf
; Queue workers (Redis) + scheduler. Restart with:
;   supervisorctl reread && supervisorctl update

[program:yemen-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/yemen-services/current/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600 --backoff=5
directory=/var/www/yemen-services/current
autostart=true
autorestart=true
stopwaitsecs=3600
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/yemen-services/queue.log
stopsignal=QUIT

[program:yemen-scheduler]
command=bash -c "while [ true ]; do php /var/www/yemen-services/current/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/yemen-services/scheduler.log

[program:yemen-horizon-note]
; If you later adopt Laravel Horizon, replace yemen-queue with:
;   command=php artisan horizon
command=/bin/true
autostart=false
